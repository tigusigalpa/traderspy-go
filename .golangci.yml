version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  settings:
    misspell:
      locale: US

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m
  tests: true
